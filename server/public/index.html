<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAuto Taxi Core - Đăng nhập Zalo</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0;
        display: flex; flex-direction: column; align-items: center; gap: 20px;
      }
      h1 { font-size: 20px; margin: 0; }
      .card {
        background: #1e293b; border-radius: 12px; padding: 20px;
        width: min(420px, 100%); box-shadow: 0 8px 24px rgba(0,0,0,.3);
      }
      #qr { width: 256px; height: 256px; display: block; margin: 12px auto;
        background: #fff; border-radius: 8px; }
      .status { text-align: center; font-weight: 600; }
      .status.success { color: #22c55e; }
      .status.pending { color: #f59e0b; }
      .status.waiting { color: #94a3b8; }
      #feed { list-style: none; padding: 0; margin: 8px 0 0; max-height: 320px; overflow-y: auto; }
      #feed li { padding: 8px 10px; border-bottom: 1px solid #334155; font-size: 14px; }
      #feed li .grp { color: #38bdf8; font-weight: 600; }
      .empty { color: #64748b; font-style: italic; }
    </style>
  </head>
  <body>
    <h1>🚖 ZAuto Taxi Core</h1>

    <div class="card">
      <div id="status" class="status waiting">Đang khởi tạo...</div>
      <img id="qr" alt="Mã QR Zalo" style="display:none" />
      <div id="success" style="display:none; text-align:center; font-size:48px">✅</div>
    </div>

    <div class="card">
      <strong>Tin nhắn nhóm gần đây</strong>
      <ul id="feed"><li class="empty">Chưa có tin nhắn nào.</li></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const qrImg = document.getElementById("qr");
      const statusEl = document.getElementById("status");
      const successEl = document.getElementById("success");
      const feed = document.getElementById("feed");

      const STATUS_TEXT = {
        waiting: "Đang chờ mã QR...",
        pending: "Quét mã QR bằng Zalo để đăng nhập",
        scanned: "Đã quét! Xác nhận trên điện thoại...",
        success: "Đăng nhập thành công",
      };

      function render(status, qrBase64) {
        statusEl.textContent = STATUS_TEXT[status] || status;
        statusEl.className = "status " + (status === "success" ? "success" : status === "waiting" ? "waiting" : "pending");
        if (status === "success") {
          qrImg.style.display = "none";
          successEl.style.display = "block";
        } else if (qrBase64) {
          qrImg.src = qrBase64;
          qrImg.style.display = "block";
          successEl.style.display = "none";
        }
      }

      // Poll the QR endpoint (works even without websockets).
      async function poll() {
        try {
          const res = await fetch("/api/get-qr");
          const data = await res.json();
          render(data.status, data.qrBase64);
          if (data.status !== "success") setTimeout(poll, 2000);
        } catch (e) {
          setTimeout(poll, 3000);
        }
      }
      poll();

      // Live updates over Socket.IO.
      const socket = io();
      socket.on("zalo_status", ({ status }) => render(status));
      socket.on("qr", ({ qrBase64 }) => render("pending", qrBase64));
      socket.on("new_zalo_message", (msg) => {
        const empty = feed.querySelector(".empty");
        if (empty) empty.remove();
        const li = document.createElement("li");
        li.innerHTML = '<span class="grp"></span>: <span class="txt"></span>';
        li.querySelector(".grp").textContent = msg.groupName || msg.groupId;
        li.querySelector(".txt").textContent = msg.content || "";
        feed.prepend(li);
      });
    </script>
  </body>
</html>
