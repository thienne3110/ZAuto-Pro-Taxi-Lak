name: Build ZAuto VIP

# Khắc phục triệt để lỗi (Line: 4, Col: 7) sai lề thụt dòng
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =====================================================
      # CACHE (Đổi sang v8 để xóa bỏ hoàn toàn rác lỗi cũ)
      # =====================================================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-2026-clean-v8

      # =====================================================
      # CLEAN SYSTEM (Giải phóng RAM và Ổ cứng cho Server)
      # =====================================================
      - name: Cleanup System
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      # =====================================================
      # INSTALL DEPENDENCIES (ÉP CYTHON BẢN CHUẨN FIX LỖI PXI)
      # =====================================================
      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            openjdk-17-jdk \
            python3-pip python3-setuptools \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

          pip3 install --user --upgrade pip

          # BẮT BUỘC dùng Cython dưới 3.0.0 để tương thích với Kivy
          pip3 install --user "Cython<3.0.0" buildozer virtualenv

      # =====================================================
      # GENERATE KEYSTORE (Chữ ký ứng dụng Android)
      # =====================================================
      - name: Generate Keystore
        run: |
          if [ ! -f mykeystore.keystore ]; then
            keytool -genkey -v \
              -keystore mykeystore.keystore \
              -alias myalias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ZAuto, OU=Taxi, O=TaxiLak, L=DakLak, ST=VN, C=VN" \
              -storepass 123456 \
              -keypass 123456
          fi

      # =====================================================
      # BUILD APK & GHI LOG SIÊU CHI TIẾT
      # =====================================================
      - name: Build APK & Extract Logs
        run: |
          set -o pipefail 
          
          export PATH=$PATH:~/.local/bin
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          # Dọn rác thư mục build
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/taxi/bin/*
          rm -rf bin/*

          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          export GRADLE_OPTS="-Xmx4096m -Dorg.gradle.daemon=false"
          
          echo "Bắt đầu build. Dữ liệu đang được ghi âm thầm ra file build_full.log..."
          
          # TỰ ĐỘNG CHẤP NHẬN BẢN QUYỀN VÀ XUẤT 100% LOG RA FILE
          yes | buildozer android debug 2>&1 | tee build_full.log

      # =====================================================
      # UPLOAD FILE LOG NẾU CÓ LỖI XẢY RA
      # =====================================================
      - name: Upload Error Logs
        if: always() # Luôn luôn lưu log lại bất chấp thành công hay sập
        uses: actions/upload-artifact@v4
        with:
          name: Build_Full_Logs
          path: build_full.log

      # =====================================================
      # UPLOAD APK NẾU THÀNH CÔNG
      # =====================================================
      - name: Upload APK
        if: success() # Chỉ xuất hiện cục file APK nếu toàn bộ quy trình màu xanh
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto_VIP_App
          path: bin/*.apk
