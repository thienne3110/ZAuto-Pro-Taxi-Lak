name: Build ZAuto VIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =====================================================
      # CONFIG PYTHON ENVIRONMENT (ĐỒNG BỘ PYTHON 3.11)
      # =====================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # CONFIG JAVA ENVIRONMENT (ÉP JDK 17)
      # =====================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # =====================================================
      # CACHE (Đồng bộ buildozer v8 sạch rác)
      # =====================================================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-2026-clean-v8

      # =====================================================
      # CLEAN SYSTEM (Giải phóng RAM và Ổ cứng cho Server)
      # =====================================================
      - name: Cleanup System
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      # =====================================================
      # INSTALL DEPENDENCIES (Thêm wheel + cấu hình biên dịch)
      # =====================================================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

          python -m pip install --upgrade pip
          # Cài đặt Wheel để hỗ trợ biên dịch nhanh C-extensions
          pip install wheel
          # Ép phiên bản Cython < 3.0.0 bắt buộc cho Kivy 2.2.1
          pip install "Cython<3.0.0" buildozer virtualenv

      # =====================================================
      # GENERATE KEYSTORE (Chữ ký ứng dụng Android)
      # =====================================================
      - name: Generate Keystore
        run: |
          if [ ! -f mykeystore.keystore ]; then
            keytool -genkey -v \
              -keystore mykeystore.keystore \
              -alias myalias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ZAuto, OU=Taxi, O=TaxiLak, L=DakLak, ST=VN, C=VN" \
              -storepass 123456 \
              -keypass 123456
          fi

      # =====================================================
      # BUILD APK WITH AUTO-LICENSES ACCEPTANCE
      # =====================================================
      - name: Build APK & Extract Logs
        run: |
          set -o pipefail 
          
          # Đảm bảo PATH nhận diện được CLI buildozer vừa cài
          export PATH=$PATH:~/.local/bin
          export GRADLE_OPTS="-Xmx4096m -Dorg.gradle.daemon=false"
          
          # Chấp nhận giấy phép Android SDK ẩn để tránh treo luồng trên Actions
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Biên dịch APK và đẩy dữ liệu log trực tiếp ra bảng điều khiển lẫn file log
          echo "Bắt đầu khởi tạo tiến trình build..."
          buildozer android debug 2>&1 | tee build_full.log

      # =====================================================
      # UPLOAD FILE LOG NẾU CÓ LỖI XẢY RA
      # =====================================================
      - name: Upload Error Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Full_Logs
          path: build_full.log

      # =====================================================
      # UPLOAD APK NẾU THÀNH CÔNG
      # =====================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto_VIP_App
          path: bin/*.apk
