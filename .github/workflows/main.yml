name: Build ZAuto VIP Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # Sử dụng Java 17 và Python 3.11 để tương thích tuyệt đối với API 33
      PYTHON_VERSION: "3.11"
      JAVA_VERSION: "17"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # -------------------------------------------------------------
      # 🚀 TỐI ƯU HÓA: CACHE SDK/NDK (Giảm thời gian build còn 3-5 phút)
      # -------------------------------------------------------------
      - name: ⚡ Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # -------------------------------------------------------------
      # ⚙️ CÀI ĐẶT CÁC THÀNH PHẦN HỆ THỐNG
      # -------------------------------------------------------------
      - name: ⚙️ Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev ccache libjpeg-dev \
            libpng-dev ffmpeg libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Sử dụng Cython 0.29.36 để tránh lỗi biên dịch nhân đồ họa
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: 📜 Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      # -------------------------------------------------------------
      # 🛡️ TRẠM KIỂM DỊCH SỚM: QUÉT LỖI SÂU TRONG 5 GIÂY
      # -------------------------------------------------------------
      - name: 🛡️ Fail-Fast (Quét lỗi sâu & Kiểm tra cấu trúc)
        run: |
          echo "--- Đang quét lỗi cú pháp toàn bộ file Python (.py) ---"
          find . -type f -name "*.py" -not -path "*/\.buildozer/*" -not -path "*/bin/*" -print -exec python -m py_compile {} \;
          
          echo "--- Đang xác minh vị trí các file hệ thống quan trọng ---"
          FILES_TO_CHECK=(
            "java/org/zauto/ZaloForegroundService.java"
            "java/org/zauto/ZaloWebManager.java"
            "java/org/zauto/ZaloAccessibility.java"
            "java/org/zauto/ZaloNotificationService.java"
            "res/xml/accessibility_config.xml"
            "res/values/strings.xml"
            "buildozer.spec"
          )

          for FILE in "${FILES_TO_CHECK[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error title=🚨 THIẾU FILE HỆ THỐNG::Không tìm thấy file: $FILE. Vui lòng kiểm tra lại cấu trúc thư mục!"
              exit 1
            else
              echo "✔️ Đã xác nhận: $FILE"
            fi
          done
          echo "✅ Cấu trúc mã nguồn hoàn hảo!"

      # -------------------------------------------------------------
      # 🔨 LỆNH BUILD CHÍNH THỨC (KHÔNG DÙNG PIPE TEE)
      # -------------------------------------------------------------
      - name: 🔨 Build Debug APK
        run: |
          # Loại bỏ hoàn toàn '| tee build.log' để GitHub Actions bắt lỗi trực tiếp từ Buildozer
          buildozer -v android debug

      # -------------------------------------------------------------
      # 🚀 UPLOAD APK (CHỈ CHẠY NẾU BUILD THÀNH CÔNG)
      # -------------------------------------------------------------
      - name: 🚀 Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZAuto_VIP_Final_APK
          path: bin/*.apk
