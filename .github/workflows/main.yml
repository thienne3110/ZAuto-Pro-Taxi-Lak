name: Build ZAuto VIP Production 24/7
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-v2026-zauto
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Cleanup System
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools libgl1-mesa-dev libgles2-mesa-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip3 install --user --upgrade pip
          pip3 install --user "Cython==0.29.36" buildozer virtualenv

      - name: Generate Keystore
        run: |
          if [ ! -f mykeystore.keystore ]; then
            keytool -genkey -v -keystore mykeystore.keystore -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZAutoPro, OU=Taxi, O=TaxiLak, L=DakLak, ST=VN, C=VN" -storepass 123456 -keypass 123456
          fi

      - name: Configure Buildozer (NATIVE JAVA INJECTION)
        run: |
          export PATH=$PATH:~/.local/bin
          if [ ! -f buildozer.spec ]; then buildozer init; fi

          sed -i 's/^#* *android.accept_sdk_license *=.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^#* *package.domain *=.*/package.domain = org.zauto/' buildozer.spec
          sed -i 's/^#* *package.name *=.*/package.name = taxi/' buildozer.spec
          sed -i 's/^#* *title *=.*/title = ZAuto VIP/' buildozer.spec
          
          # THÊM ĐỊNH DẠNG FILE JAVA, XML
          sed -i 's/^#* *source.include_exts *=.*/source.include_exts = py,png,jpg,kv,json,xml,java/' buildozer.spec
          sed -i 's/^#* *requirements *=.*/requirements = python3,kivy==2.2.1,kivymd,pyjnius/' buildozer.spec
          
          # CẤP QUYỀN HỆ THỐNG FULL CHO ANDROID 13/14
          sed -i 's/^#* *android.permissions *=.*/android.permissions = INTERNET,FOREGROUND_SERVICE,RECEIVE_BOOT_COMPLETED,WAKE_LOCK,REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,POST_NOTIFICATIONS,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,ACCESS_BACKGROUND_LOCATION,SYSTEM_ALERT_WINDOW/' buildozer.spec

          # BƠM THƯ MỤC JAVA VÀ RES VÀO BUILDOZER
          sed -i '/^#* *android.permissions/a android.add_src = java' buildozer.spec
          sed -i '/^#* *android.permissions/a android.add_resources = res' buildozer.spec

          # --- [QUAN TRỌNG] XÓA KHAI BÁO SERVICE PYTHON CŨ ---
          sed -i 's/^#* *services *=.*//' buildozer.spec
          
          # --- [QUAN TRỌNG] CHÍCH THẲNG KHAI BÁO SERVICE JAVA VÀO MANIFEST ---
          echo 'android.manifest.extra_manifest_application_arguments = <service android:name="org.zauto.ZaloAccessibility" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" /></service><service android:name="org.zauto.ZaloForegroundService" android:exported="false" />' >> buildozer.spec

          # UPDATE API LEVEL CHO CHUẨN NATIVE
          sed -i 's/^#* *android.api *=.*/android.api = 34/' buildozer.spec
          sed -i 's/^#* *android.minapi *=.*/android.minapi = 24/' buildozer.spec
          sed -i 's/^#* *android.archs *=.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^#* *android.release_artifact *=.*/android.release_artifact = apk/' buildozer.spec
          
          sed -i 's|^#* *android.release_keystore *=.*|android.release_keystore = '"$(pwd)"'/mykeystore.keystore|' buildozer.spec
          sed -i 's/^#* *android.release_keyalias *=.*/android.release_keyalias = myalias/' buildozer.spec

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer android p4a --accept-sdk-license || true

          rm -rf bin/*.aab
          rm -rf bin/*.apk

          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.daemon=false"
          export P4A_RELEASE_KEYSTORE=$(pwd)/mykeystore.keystore
          export P4A_RELEASE_KEYSTORE_PASSWD=123456
          export P4A_RELEASE_KEYALIAS_PASSWD=123456
          export P4A_RELEASE_KEYALIAS=myalias

          buildozer -v android release

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto_VIP_Production
          path: bin/*.apk
