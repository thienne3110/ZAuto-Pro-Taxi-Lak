name: Build ZAuto VIP Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PYTHON_VERSION: "3.10"
      JAVA_VERSION: "17"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ĐỔI KHÓA CACHE SANG V8 ĐỂ ÉP HỆ THỐNG QUÊN ĐI MANIFEST CŨ
      - name: ⚡ Cache Gradle & Pip
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/pip
          key: ${{ runner.os }}-gradle-pip-v12-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-gradle-pip-v12-

      - name: ⚙️ Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev ccache libjpeg-dev \
            libpng-dev ffmpeg libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip==23.2.1
          pip install setuptools wheel
          pip install Cython==0.29.36 buildozer==1.5.0

      # ĐÃ THÊM FILE manifest_services.xml VÀO DANH SÁCH KIỂM TRA BẮT BUỘC
      - name: 🛡️ Fail-Fast (Kiểm dịch cấu trúc)
        run: |
          find . -type f -name "*.py" -not -path "*/\.buildozer/*" -not -path "*/bin/*" -print -exec python -m py_compile {} \;
          FILES_TO_CHECK=("java/org/zauto/ZaloForegroundService.java" "java/org/zauto/ZaloWebManager.java" "res/xml/accessibility_config.xml" "manifest_services.xml" "buildozer.spec")
          for FILE in "${FILES_TO_CHECK[@]}"; do
            if [ ! -f "$FILE" ]; then echo "::error::THIẾU FILE: $FILE"; exit 1; fi
          done

      # DỌN RÁC TRIỆT ĐỂ 100%: Xóa cả local lẫn Global Buildozer
      - name: 🧹 Clean Local Buildozer
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin

      # LỆNH BUILD THUẦN TÚY: Không nuốt exit code, không che giấu lỗi
      - name: 🔨 Build Debug APK
        run: |
          export PATH=$PATH:~/.local/bin
          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.daemon=false"
          
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          buildozer -v android debug

      - name: 🚀 Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZAuto_VIP_Final_APK
          path: bin/*.apk
