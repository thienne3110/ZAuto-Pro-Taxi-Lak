name: Build ZAuto VIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # Nâng cấp lên Python 3.11 và Java 17 để tương thích Gradle bản mới
      PYTHON_VERSION: "3.11"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          sudo apt update
          # Đã gỡ openjdk-11-jdk vì setup-java ở trên đã tự động quản lý Java 17
          sudo apt install -y \
            zip unzip git \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev \
            libffi-dev libssl-dev \
            ccache \
            libjpeg-dev \
            libpng-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Nâng cấp version để tránh lỗi buildozer cũ
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build Debug APK
        run: |
          # Chỉ chạy lệnh build, tuyệt đối không dùng clean ở đây để tránh lỗi mất file
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto_APK
          path: bin/*.apk
