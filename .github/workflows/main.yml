name: Build ZAuto VIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
          key: buildozer-v2026-v5
          restore-keys: buildozer-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools libgl1-mesa-dev libgles2-mesa-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip3 install --user --upgrade pip
          pip3 install --user "Cython==0.29.36" buildozer virtualenv

      - name: Configure and Fix Resources
        run: |
          export PATH=$PATH:~/.local/bin
          mkdir -p res/xml res/values java/org/zauto
          
          # Tạo file strings
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">ZAuto VIP</string><string name="accessibility_desc">Dịch vụ hỗ trợ tự động nhận cuốc ZAuto VIP</string></resources>' > res/values/strings.xml
          
          # Tạo file trợ năng
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged" android:accessibilityFeedbackType="feedbackGeneric" android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows" android:canRetrieveWindowContent="true" android:description="@string/accessibility_desc" android:notificationTimeout="100" />' > res/xml/accessibility_config.xml

          # Khởi tạo và cấu hình spec
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          sed -i 's/^#* *android.accept_sdk_license *=.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^#* *package.domain *=.*/package.domain = org.zauto/' buildozer.spec
          sed -i 's/^#* *package.name *=.*/package.name = taxi/' buildozer.spec
          sed -i 's/^#* *title *=.*/title = ZAuto VIP/' buildozer.spec
          sed -i 's/^#* *requirements *=.*/requirements = python3,kivy==2.2.1,kivymd==1.1.1,pyjnius/' buildozer.spec
          sed -i 's/^#* *android.permissions *=.*/android.permissions = INTERNET,FOREGROUND_SERVICE,FOREGROUND_SERVICE_DATA_SYNC,RECEIVE_BOOT_COMPLETED,BIND_NOTIFICATION_LISTENER_SERVICE,WAKE_LOCK,REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,POST_NOTIFICATIONS,ACCESS_FINE_LOCATION,SYSTEM_ALERT_WINDOW,QUERY_ALL_PACKAGES/' buildozer.spec
          sed -i 's/^#* *android.api *=.*/android.api = 34/' buildozer.spec
          sed -i 's/^#* *android.minapi *=.*/android.minapi = 24/' buildozer.spec
          sed -i 's/^#* *android.archs *=.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^#* *android.add_src *=.*/android.add_src = java/' buildozer.spec
          sed -i 's/^#* *android.add_resources *=.*/android.add_resources = res/' buildozer.spec
          
          # Tiêm Manifest bằng cách nối chuỗi an toàn
          sed -i '/^android.extra_manifest_application/d' buildozer.spec
          echo 'android.extra_manifest_application = <receiver android:name="org.zauto.BootReceiver" android:enabled="true" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver> <service android:name="org.zauto.ZaloNotificationService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter></service> <service android:name="org.zauto.ZaloAccessibility" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true" android:label="ZAuto VIP"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" /></service> <service android:name="org.zauto.ZaloForegroundService" android:exported="false" android:foregroundServiceType="dataSync"/>' >> buildozer.spec

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          # Xóa build cũ để nạp tài nguyên mới
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/taxi/build
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto_VIP_App
          path: bin/*.apk
