name: Build ZAuto VIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PYTHON_VERSION: "3.11"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev ccache libjpeg-dev \
            libpng-dev ffmpeg libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      # -------------------------------------------------------------
      # LỆNH BUILD (XẢ LOG VÀO FILE ĐỂ PHÂN TÍCH)
      # -------------------------------------------------------------
      - name: Build Debug APK
        run: |
          # Dùng 'tee' để vừa hiển thị log ra màn hình, vừa lưu vào file build.log
          buildozer -v android debug 2>&1 | tee build.log

      # -------------------------------------------------------------
      # 🚨 MÁY QUÉT LỖI: TỰ ĐỘNG BÔI ĐỎ KHI BUILD THẤT BẠI
      # -------------------------------------------------------------
      - name: 🚨 Scan & Highlight Errors (Nếu Build Thất Bại)
        if: failure()
        run: |
          echo "Bắt đầu quét file log để tìm nguyên nhân lỗi..."
          
          # Dùng grep để bốc tách các dòng chứa lỗi (không phân biệt hoa thường)
          grep -i -E "error|exception|traceback|failed|conflict|not resolved|syntax" build.log > error_summary.txt || true
          
          # 1. Bắn lệnh ::error:: để GitHub hiển thị chữ MÀU ĐỎ chót ở mục Annotations
          echo "::error title=🚨 TỔNG HỢP CÁC DÒNG LỖI (XEM BÊN DƯỚI)::Quá trình build thất bại. Đã tìm thấy các dòng lỗi sau:"
          while IFS= read -r line; do
            # Bỏ qua các dòng log rác, chỉ bôi đỏ các dòng thực sự chứa lỗi
            if [[ "$line" != *"errors.log"* ]]; then
              echo "::error::$line"
            fi
          done < error_summary.txt

          # 2. In ra bảng Summary Dashboard để bạn copy dễ dàng
          echo "### 🚨 TỔNG HỢP LỖI (ERROR LOGS BÔI ĐỎ)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          cat error_summary.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        # Chỉ upload file nếu bước build phía trên thành công
        if: success()
        with:
          name: ZAuto_APK
          path: bin/*.apk
