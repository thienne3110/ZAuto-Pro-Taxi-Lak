name: Build ZAuto VIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # =====================================================
      # CACHE
      # =====================================================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v2026-clean-v1

      # =====================================================
      # CLEAN SYSTEM
      # =====================================================
      - name: Cleanup System
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            openjdk-17-jdk \
            python3-pip python3-setuptools \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

          pip3 install --user --upgrade pip

          pip3 install --user \
            Cython==0.29.36 \
            buildozer \
            virtualenv

      # =====================================================
      # GENERATE KEYSTORE
      # =====================================================
      - name: Generate Keystore
        run: |
          if [ ! -f mykeystore.keystore ]; then
            keytool -genkey -v \
              -keystore mykeystore.keystore \
              -alias myalias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ZAuto, OU=Taxi, O=TaxiLak, L=DakLak, ST=VN, C=VN" \
              -storepass 123456 \
              -keypass 123456
          fi

      # =====================================================
      # CREATE RESOURCE FILES
      # =====================================================
      - name: Create Android Resources
        run: |
          mkdir -p java/org/zauto

          # =================================================
          # BOOT RECEIVER (Chỉ giữ lại cái này để chạy ngầm)
          # =================================================
          cat > java/org/zauto/BootReceiver.java <<EOF
          package org.zauto;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          import org.kivy.android.PythonActivity;

          public class BootReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {

                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {

                      Intent i =
                          new Intent(context, PythonActivity.class);

                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      context.startActivity(i);
                  }
              }
          }
          EOF

      # =====================================================
      # CREATE BUILDOZER SPEC
      # =====================================================
      - name: Generate buildozer.spec
        run: |
          cat > buildozer.spec <<EOF
          [app]

          title = ZAuto VIP

          package.name = taxi
          package.domain = org.zauto

          source.dir = .
          source.include_exts = py,png,jpg,kv,json,xml,java,db

          version = 7.0

          requirements = python3,kivy==2.2.1,kivymd==1.1.1,pyjnius

          orientation = portrait

          icon.filename = icon.png

          android.permissions = INTERNET,FOREGROUND_SERVICE,FOREGROUND_SERVICE_DATA_SYNC,RECEIVE_BOOT_COMPLETED,WAKE_LOCK,REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,POST_NOTIFICATIONS,SYSTEM_ALERT_WINDOW,QUERY_ALL_PACKAGES

          android.api = 34
          android.minapi = 24

          android.archs = arm64-v8a, armeabi-v7a

          android.enable_androidx = True

          android.add_src = ./java

          android.gradle_dependencies = \
              androidx.core:core:1.12.0

          android.foreground_service = True

          android.accept_sdk_license = True

          p4a.branch = master

          android.extra_manifest_application = \
              <receiver android:name="org.zauto.BootReceiver" \
                  android:enabled="true" \
                  android:exported="true"> \
                  <intent-filter> \
                      <action android:name="android.intent.action.BOOT_COMPLETED" /> \
                  </intent-filter> \
              </receiver> \
              \
              <service android:name="org.zauto.ZaloForegroundService" \
                  android:exported="false" \
                  android:foregroundServiceType="dataSync"/>

          android.release_keystore = mykeystore.keystore
          android.release_keyalias = myalias

          log_level = 2

          [buildozer]

          build_dir = ./.buildozer
          bin_dir = ./bin
          EOF

      # =====================================================
      # BUILD APK
      # =====================================================
      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          rm -rf .buildozer
          rm -rf bin/*

          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          export GRADLE_OPTS="-Xmx4096m -Dorg.gradle.daemon=false"

          buildozer android debug || true

          echo "=========== FULL GRADLE ERROR ==========="

          cd .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/taxi

          ./gradlew assembleDebug --stacktrace --info

      # =====================================================
      # UPLOAD APK
      # =====================================================
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto_VIP_App
          path: bin/*.apk
