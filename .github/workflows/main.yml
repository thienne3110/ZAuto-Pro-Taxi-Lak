name: Build ZAuto VIP Enterprise Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90 # Khóa thời gian build hợp lý, bảo vệ tài nguyên chống treo ngầm

    # Cố định Locale UTF-8 để chống triệt để lỗi UnicodeDecodeError khi log/compile
    env:
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
      PYTHON_VERSION: "3.11"
      JAVA_VERSION: "17"
      CYTHON_VERSION: "0.29.36"
      BUILDOZER_VERSION: "1.5.0"
      VIRTUALENV_VERSION: "20.26.6"

    steps:
      # =====================================================
      # CHECKOUT SOURCE CODE
      # =====================================================
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =====================================================
      # SETUP SWAP MEMORY & SYSTEM DIAGNOSTICS (CHỐNG OOM)
      # =====================================================
      - name: Setup Swap Space & Diagnostics
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "===== SYSTEM INFO ====="
          echo "CPU Cores: $(nproc)"
          echo "===== RAM STATUS ====="
          free -m
          echo "===== DISK SPACE ====="
          df -h

      # =====================================================
      # SET UP PYTHON (FIXED 3.11)
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # =====================================================
      # SET UP JAVA (FIXED JDK 17 TEMURIN)
      # =====================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =====================================================
      # CACHE ENTERPRISE SYSTEM (ĐỒNG BỘ ĐA TẦNG CỰC KỲ SẠCH)
      # =====================================================
      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
            ~/.cache/pip
            ~/.ccache
          key: buildozer-v13-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v13-${{ runner.os }}-
            buildozer-v13-

      # =====================================================
      # GIẢI PHÓNG DUNG LƯỢNG Ổ ĐĨA KHÔNG CẦN THIẾT
      # =====================================================
      - name: Deep Cleanup System Disk
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "/usr/local/share/boost" || true
          sudo docker system prune -af || true

      # =====================================================
      # CÀI ĐẶT THƯ VIỆN HỆ THỐNG & CẤU HÌNH CCACHE
      # =====================================================
      - name: Install System Dependencies & Pin Tools
        run: |
          sudo apt update

          sudo apt install -y \
            git zip unzip ccache \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libjpeg-dev \
            libpng-dev

          # Ép cấu hình ccache tăng tốc biên dịch Cython gấp 4 lần ở các build kế tiếp
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

          python -m pip install --upgrade \
            "pip<25" \
            "setuptools<69" \
            "wheel<0.43"

          pip install \
            "Cython==${{ env.CYTHON_VERSION }}" \
            "buildozer==${{ env.BUILDOZER_VERSION }}" \
            "virtualenv==${{ env.VIRTUALENV_VERSION }}"

          # Sử dụng GITHUB_PATH chuẩn của GitHub thay vì can thiệp ghi đè PATH thủ công
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # =====================================================
      # CẤU HÌNH GRADLE TỐI ƯU (CHỐNG TREO GRADLE DAEMON)
      # =====================================================
      - name: Optimize Gradle Properties
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          org.gradle.configureondemand=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          EOF

      # =====================================================
      # FAIL FAST VALIDATION: KIỂM TRA FILE REPO TRƯỚC KHI CHẠY
      # =====================================================
      - name: Validate Project Files
        run: |
          REQUIRED_FILES=(
            "buildozer.spec"
            "main.py"
          )

          for file in "${REQUIRED_FILES[@]}"
          do
            if [ ! -f "$file" ]; then
              echo "::error::Không tìm thấy tệp tin bắt buộc: $file"
              exit 1
            fi
          done

      # =====================================================
      # FAIL FAST VALIDATION: KIỂM TRA GITHUB SECRETS SẮN SÀNG
      # =====================================================
      - name: Validate Production Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Thiếu biến KEYSTORE_PASSWORD cấu hình trong GitHub Secrets!"
            exit 1
          fi

          if [ -z "${{ secrets.KEY_ALIAS_PASSWORD }}" ]; then
            echo "::error::Thiếu biến KEY_ALIAS_PASSWORD cấu hình trong GitHub Secrets!"
            exit 1
          fi

      # =====================================================
      # GENERATE PROTECTED KEYSTORE FOR SIGNING
      # =====================================================
      - name: Generate Protected Keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASS: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          if [ ! -f mykeystore.keystore ]; then
            keytool -genkey -v \
              -keystore mykeystore.keystore \
              -alias myalias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ZAuto, OU=Taxi, O=TaxiLak, L=DakLak, ST=VN, C=VN" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_ALIAS_PASS"
          fi

      # =====================================================
      # BIÊN DỊCH RELEASE APK (SMART RETRY & RECOVERY SYSTEM)
      # =====================================================
      - name: Compile Release APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          P4A_RELEASE_KEYSTORE: mykeystore.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEY_ALIAS_PASSWD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          P4A_RELEASE_KEY_ALIAS: myalias
        run: |
          set -o pipefail

          # Cấu hình sẵn repositories tránh lỗi cảnh báo SDK
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          mkdir -p bin
          rm -rf bin/*

          # ĐỒNG BỘ CHUẨN BIẾN MÔI TRƯỜNG SHELL VÀ GITHUB WORKFLOW (CHỐNG LỖI LOCATION)
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

          echo "===== TIẾN TRÌNH KHỞI CHẠY BUILD RELEASE APK ====="

          build_success=false

          # Tự động accept licenses nếu cache đã có sẵn thư mục tools trước
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "===== ĐỒNG Ý CÁC ĐIỀU KHOẢN ANDROID SDK ====="
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

          echo "===== BIÊN DỊCH: LẦN THỬ 1 ====="

          # Sử dụng pipe "tee" để xuất toàn bộ log chi tiết vừa ra màn hình vừa ghi vào file
          if buildozer android release 2>&1 | tee build_full.log; then
            build_success=true
          else
            echo "===== PHÁT HIỆN LỖI LẦN 1: TIẾN HÀNH KHÔI PHỤC NGẦM ====="

            # Tắt triệt để Gradle Daemon đang chạy ngầm tránh giữ tệp khóa (lock) rác
            pkill -9 -f gradle || true
            pkill -9 -f GradleDaemon || true

            # Gọi appclean để dọn cache nhẹ, TUYỆT ĐỐI không dùng clean phá hủy SDK/NDK đã tải cực kỳ nặng
            buildozer appclean || true

            sleep 5

            # Cấp phép lại SDK phòng trường hợp phân vùng bị thay đổi nhẹ sau appclean
            if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            fi

            echo "===== BIÊN DỊCH: LẦN THỬ 2 (RETRY CHUẨN) ====="

            if buildozer android release 2>&1 | tee -a build_full.log; then
              build_success=true
            fi
          fi

          if [ "$build_success" = false ]; then
            echo "::error::Biên dịch ứng dụng thất bại hoàn toàn sau 2 lần thử!"
            exit 1
          fi

      # =====================================================
      # VERIFY APK SIGNATURE (APKSIGNER VỚI FALLBACK JARSIGNER)
      # =====================================================
      - name: Verify APK Signature
        run: |
          APK_FILE=$(find bin -name "*.apk" | head -n 1)

          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Lỗi nghiêm trọng: Không tìm thấy tệp tin APK sau khi build!"
            exit 1
          fi

          echo "Đang tiến hành verify tệp tin: $APK_FILE"

          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk

          # Định vị động apksigner dựa trên thư mục build-tools thực tế (Chống quét find toàn hệ thống gây lag)
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools"
          APKSIGNER_PATH=""

          if [ -d "$BUILD_TOOLS_DIR" ]; then
            LATEST_BUILD_TOOLS=$(ls -1 "$BUILD_TOOLS_DIR" | sort -V | tail -n 1)
            if [ -n "$LATEST_BUILD_TOOLS" ]; then
              APKSIGNER_PATH="$BUILD_TOOLS_DIR/$LATEST_BUILD_TOOLS/apksigner"
            fi
          fi

          if [ -n "$APKSIGNER_PATH" ] && [ -f "$APKSIGNER_PATH" ]; then
            echo "Tìm thấy apksigner tại: $APKSIGNER_PATH"
            "$APKSIGNER_PATH" verify --print-certs "$APK_FILE"
            echo "Xác thực chữ ký số APK bằng apksigner thành công!"
          else
            echo "Cảnh báo: Không tìm thấy apksigner. Chuyển sang sử dụng fallback jarsigner..."
            jarsigner -verify \
              -keystore mykeystore.keystore \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              "$APK_FILE" \
              myalias
            echo "Xác thực chữ ký số APK bằng jarsigner thành công!"
          fi

      # =====================================================
      # EXTRACT DIAGNOSTICS & PRE-CACHE GRADLE CLEANUP (CRITICAL)
      # =====================================================
      - name: Extract Diagnostics & Clean Lock Files
        if: always()
        run: |
          mkdir -p bin

          # Sao chép các tệp Proguard Mapping dự phòng về thư mục bin phục vụ gỡ lỗi sau này
          find .buildozer -name "mapping.txt" -exec cp {} ./bin/ \; || true
          find .buildozer -name "proguard-rules.pro" -exec cp {} ./bin/ \; || true

          # Trích xuất có chọn lọc các dòng lỗi thực tế trong file log lớn bằng Regex thông minh
          echo "=== TỔNG HỢP CÁC LỖI TRONG TIẾN TRÌNH BIÊN DỊCH ===" > bin/error_diagnostics.log

          if [ -f build_full.log ]; then
            grep -i -E \
            "error:|fatal:|failed|exception|traceback|sdk|ndk|javac|gradle|cannot find|make: \*\*\*" \
            build_full.log >> bin/error_diagnostics.log || true
          fi

          echo "===== TỆP TIN XUẤT XƯỞNG TRONG THƯ MỤC BIN ====="
          ls -lah bin/

          # DỌN DẸP TRƯỚC KHI LƯU CACHE GITHUB: Xóa sạch tệp khóa tạm để không làm nghẽn lượt chạy sau (PRE-CACHE CLEANUP)
          echo "===== DỌN DẸP TỆP KHÓA GRADLE TRÁNH NGHẼN CACHE LẦN CHẠY KẾ TIẾP ====="
          find ~/.gradle/caches -name "*.lock" -type f -delete || true
          find ~/.gradle -name "*.gc" -type f -delete || true

          if ! ls bin/*.apk 1> /dev/null 2>&1; then
            echo "::error::Tiến trình kết thúc không sinh ra file APK!"

            echo "===== TRÍCH XUẤT 300 DÒNG LOG CUỐI CÙNG KHI BIÊN DỊCH THẤT BẠI ====="
            if [ -f build_full.log ]; then
              tail -n 300 build_full.log
            fi

            exit 1
          fi

      # =====================================================
      # UPLOAD DIAGNOSTIC LOGS & MAPPING
      # =====================================================
      - name: Upload Diagnostics and Mappings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic_And_Mapping_Logs
          if-no-files-found: warn
          path: |
            bin/error_diagnostics.log
            bin/mapping.txt
            bin/proguard-rules.pro

      # =====================================================
      # UPLOAD FINAL RELEASE APK
      # =====================================================
      - name: Upload Production Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto_VIP_Enterprise_Release_APK
          if-no-files-found: error # Chặn xuất bản gói rỗng, ép fail nếu không tìm thấy APK
          path: bin/*.apk
