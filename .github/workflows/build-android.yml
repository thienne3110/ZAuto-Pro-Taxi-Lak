name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 📦 Install dependencies
        working-directory: android-app
        run: npm install

      - name: 🔧 Expo Prebuild
        working-directory: android-app
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Cấp quyền gradlew
        working-directory: android-app/android
        run: chmod +x gradlew

      - name: ⚙️ Tăng RAM cho Gradle
        working-directory: android-app/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: 🏗️ Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
          NODE_ENV: production

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto-Taxi-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Tạo Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "ZAuto Taxi v${{ github.run_number }}"
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            📱 Build tự động - Commit: ${{ github.sha }}

            **Cách cài:**
            1. Tải file `app-debug.apk` bên dưới
            2. Copy sang điện thoại Android
            3. Bật "Cài từ nguồn không rõ" trong Settings
            4. Mở file APK để cài đặt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
