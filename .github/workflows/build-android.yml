name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (không cần EAS)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 📦 Install dependencies
        working-directory: android-app
        run: npm install

      - name: 🔧 Expo Prebuild (tạo native Android project)
        working-directory: android-app
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Cấp quyền gradlew
        working-directory: android-app/android
        run: chmod +x gradlew

      - name: 🏗️ Build APK Debug (không cần keystore)
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAuto-Taxi-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Tạo Release tự động
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "ZAuto Taxi v${{ github.run_number }}"
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ✅ Build tự động từ commit ${{ github.sha }}
            📱 Tải file APK bên dưới về cài đặt trên Android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
